<div id="dc-root"></div>
<template id="dc-tpl"><div class="{{ rootClass }}" ref="{{ rootRef }}" style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; background: {{ t.bg }}; color: {{ t.ink }}; font-family: 'JetBrains Mono', ui-monospace, monospace; min-width: 320px; transition: color 0.6s; --bg: {{ t.bg }}; --line: {{ t.line }}; --soft: {{ t.soft }}; --page: {{ t.page }}; --rim: {{ t.rim }}; --bar: {{ barPx }}">
  <canvas ref="{{ stageRef }}" data-ferro-stage="orb" role="img" aria-label="A glossy black ferrofluid droplet floating on a curved CRT screen, growing spikes toward whatever pulls it" style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 0"></canvas>
  <div class="f8-glass" aria-hidden="true" style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; background: {{ scanBg }}; pointer-events: none; opacity: {{ scanOpacity }}"></div>

  <canvas class="f8-field" data-sec="{{ fieldSec }}" aria-hidden="true"></canvas>

  <section class="{{ homeClass }}" data-scr="home" ref="{{ homeRef }}" aria-label="FERRO-88 system menu with an interactive ferrofluid droplet" aria-hidden="{{ homeHidden }}" onScroll="{{ scrScroll }}">
    <div class="f8-hero">
      <div class="f8-window" aria-hidden="true"></div>
      <nav class="f8-menu" aria-label="System menu" style="position: absolute; left: var(--edge-x); top: 230px; display: flex; flex-direction: column; gap: 18px; color: {{ t.ink }}">
        <sc-for list="{{ menu }}" as="m" hint-placeholder-count="4">
          <a class="f8-item" href="{{ m.href }}" data-go="{{ m.id }}" draggable="false" onMouseEnter="{{ m.enter }}" onMouseLeave="{{ m.leave }}" onFocus="{{ m.enter }}" onBlur="{{ m.leave }}" onPointerDown="{{ m.down }}" onPointerUp="{{ m.up }}" onClick="{{ m.click }}" style="display: flex; align-items: center; gap: 20px; min-height: 48px; color: inherit; text-decoration: none; --i: {{ m.i }}">
            <span class="f8-slot" aria-hidden="true" style="flex: none; width: 22px; height: 40px; border: 1.6px solid currentColor; border-radius: 5px; background: {{ m.slot }}; opacity: {{ m.opacity }}"></span>
            <span class="f8-itext" style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
              <span class="f8-label" style="font-family: 'Michroma', sans-serif; font-size: 50px; line-height: 1; letter-spacing: 0.04em; opacity: {{ m.opacity }}">{{ m.label }}</span>
              <span class="f8-cap" style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase">{{ m.cap }}</span>
            </span>
          </a>
        </sc-for>
      </nav>
      <div class="f8-start" style="position: absolute; left: var(--edge-x); bottom: var(--edge-b); display: flex; flex-direction: column; gap: 10px; color: {{ t.ink }}">
        <span class="f8-press" style="font-family: 'Doto', monospace; font-weight: 900; font-size: 26px; letter-spacing: 0.14em; animation: {{ pressAnim }}">{{ pressText }}</span>
      </div>
      <div class="f8-status" role="status" aria-live="off" style="position: absolute; right: var(--edge-x); bottom: var(--edge-b); display: flex; gap: 22px; font-family: 'Doto', monospace; font-weight: 900; font-size: 18px; letter-spacing: 0.08em; color: {{ t.ink }}">
        <span>CH {{ channel }}</span><span>{{ note }}</span><span class="f8-wide">{{ musicState }}</span>
      </div>
    </div>
  </section>

  <section class="{{ aboutClass }}" data-scr="about" ref="{{ aboutRef }}" aria-label="About" aria-hidden="{{ aboutHidden }}" onScroll="{{ scrScroll }}">
    <div class="f8-sec">
      <h2 class="f8-h2 f8-big f8-p" tabindex="-1">About</h2>
      <p class="f8-statement f8-p"><span class="f8-base" data-base="1"></span>[Two sentences about you and the work you want next.]</p>
      <dl class="f8-facts">
        <div class="f8-p"><dt>Name</dt><dd>[Your Name]</dd></div>
        <div class="f8-p"><dt>Discipline</dt><dd>[Your discipline]</dd></div>
        <div class="f8-p"><dt>Base</dt><dd>[City]</dd></div>
        <div class="f8-p f8-whole"><dt>Skills</dt><dd>[Skill] · [Skill] · [Skill] · [Skill]</dd></div>
      </dl>
    </div>
  </section>

  <section class="{{ worksClass }}" data-scr="works" ref="{{ worksRef }}" aria-label="Works" aria-hidden="{{ worksHidden }}" onScroll="{{ scrScroll }}">
    <div class="f8-sec f8-sec-works">
      <div class="f8-head f8-p"><h2 class="f8-h2 f8-small" tabindex="-1">Works</h2><span class="f8-note">Selected projects</span></div>
      <ol class="f8-works">
        <sc-for list="{{ projects }}" as="p" hint-placeholder-count="6">
          <li class="f8-p"><button class="f8-row" type="button" aria-current="{{ p.on }}" aria-label="{{ p.aria }}" onMouseEnter="{{ p.pick }}" onFocus="{{ p.pick }}" onClick="{{ p.click }}"><span class="f8-rt"><span class="f8-base" data-base="1"></span>[Project title]</span><span class="f8-rm"><span>[Client] · [Role]</span><span>[Year]</span></span></button></li>
        </sc-for>
      </ol>
      <div class="f8-art f8-p" aria-hidden="true">[COVER ART]</div>
    </div>
  </section>

  <section class="{{ philosophyClass }}" data-scr="philosophy" ref="{{ philosophyRef }}" aria-label="Philosophy" aria-hidden="{{ philosophyHidden }}" onScroll="{{ scrScroll }}">
    <div class="f8-sec">
      <h2 class="f8-h2 f8-small f8-p" tabindex="-1">Philosophy</h2>
      <p class="f8-para f8-p"><span class="f8-base" data-base="1"></span>[Your philosophy goes here, as one long paragraph. Say what you believe about the work, what you refuse to do, and what you would still make if nobody were watching. Aim for five or six sentences, about this long, so the words fill the screen at this size. Keep the sentences plain, and let the page do the rest.]<span class="f8-base" data-rest="1"></span></p>
    </div>
  </section>

  <section class="{{ contactClass }}" data-scr="contact" ref="{{ contactRef }}" aria-label="Contact" aria-hidden="{{ contactHidden }}" onScroll="{{ scrScroll }}">
    <div class="f8-sec">
      <h2 class="f8-h2 f8-big f8-p" tabindex="-1">Contact</h2>
      <div class="f8-p"><a class="f8-email" href="mailto:hello@example.com" onClick="{{ ctaClick }}"><span class="f8-base" data-base="1"></span>[your@email.com]</a></div>
      <p class="f8-replies f8-p">Replies within [N] days.</p>
      <div class="f8-socials f8-p"><a href="#contact">[Social link]</a><a href="#contact">[Social link]</a><a href="#contact">[Social link]</a></div>
      <footer class="f8-colo f8-p"><span>© [Year] [Your Name]</span><span>FM voices, chimes and CRT hum synthesised live, no samples.</span></footer>
    </div>
  </section>

  <header class="{{ topClass }}" ref="{{ topRef }}" style="position: fixed; z-index: 3; top: var(--edge-y); left: var(--edge-x); right: var(--edge-x); display: flex; align-items: center; justify-content: space-between; gap: 24px; color: {{ t.ink }}">
    <div class="f8-brand" style="display: flex; align-items: center; gap: 16px">
      <svg class="f8-logo" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><rect x="1.5" y="1.5" width="43" height="43" rx="11" fill="none" stroke="currentColor" stroke-width="1.6"></rect><circle cx="23" cy="21" r="8.5" fill="currentColor"></circle><path d="M18 28l2 6 2-5 1 6 1.5-6 2 5 1.5-6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>
      <div class="f8-brandtext">
        <div class="f8-name" style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-family: 'Michroma', sans-serif; font-size: 14px; letter-spacing: 0.12em">FERRO-88</span>
          <span class="f8-sub" style="font-size: 11px; letter-spacing: 0.08em">[Your Name]<span class="f8-ver"> · system v1.0</span></span>
        </div>
        <button class="f8-back f8-pill" type="button" onClick="{{ goHome }}" aria-label="Back to the menu" style="justify-self: start; display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px 0 14px; border: 1.6px solid currentColor; border-radius: 999px; background: rgba(255,255,255,0.12); color: inherit; font: inherit; font-size: 12px; letter-spacing: 0.14em; cursor: pointer; white-space: nowrap">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>MENU</span>
        </button>
      </div>
    </div>
    <div class="f8-ctrl" style="display: flex; align-items: center; gap: 12px">
      <span class="f8-clock" style="font-family: 'Doto', monospace; font-weight: 900; font-size: 18px; letter-spacing: 0.06em">{{ clock }}</span>
      <div class="{{ volClass }}" onPointerEnter="{{ volEnter }}" onPointerLeave="{{ volLeave }}" onFocus="{{ volFocus }}" onBlur="{{ volBlur }}">
        <span class="f8-volpop" aria-hidden="true"></span>
        <button class="f8-round" onPointerDown="{{ musicDown }}" onPointerCancel="{{ musicCancel }}" onClick="{{ toggleMusic }}" aria-pressed="{{ musicPressed }}" aria-label="Toggle self-playing music" style="width: 46px; height: 46px; border-radius: 50%; border: 1.6px solid currentColor; background: rgba(255,255,255,0.12); color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{ musicOpacity }}">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15V4.5l9-2V13"></path><circle cx="5.5" cy="15" r="2"></circle><circle cx="14.5" cy="13" r="2"></circle></g></svg>
        </button>
        <button class="f8-round" onClick="{{ toggleSound }}" aria-pressed="{{ soundPressed }}" aria-label="Toggle sound" style="width: 46px; height: 46px; border-radius: 50%; border: 1.6px solid currentColor; background: rgba(255,255,255,0.12); color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{ soundOpacity }}">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3.5v11L6 12H3z"></path><path data-hole-d="{{ soundWave }}"></path></g></svg>
        </button>
        <div class="f8-volctl">
          <span class="f8-volbars" aria-hidden="true" style="opacity: {{ volDim }}">
            <sc-for list="{{ volBars }}" as="b" hint-placeholder-count="10"><span class="f8-volbar" style="{{ b.style }}"></span></sc-for>
          </span>
          <input class="f8-volin" type="range" min="0" max="10" step="1" value="{{ volValue }}" onChange="{{ setVol }}" aria-label="Volume" aria-valuetext="{{ volText }}">
          <span class="f8-volhit" aria-hidden="true" onPointerDown="{{ volDown }}" onPointerMove="{{ volMove }}"></span>
        </div>
      </div>
    </div>
  </header>


  <nav class="{{ chanClass }}" aria-label="Sections">
    <sc-for list="{{ chans }}" as="c" hint-placeholder-count="4"><button class="f8-chan" type="button" aria-current="{{ c.cur }}" onMouseEnter="{{ c.warm }}" onFocus="{{ c.warm }}" onPointerDown="{{ c.warm }}" onClick="{{ c.go }}"><span><span class="f8-n">{{ c.n }} </span>{{ c.name }}</span></button></sc-for>
  </nav>
</div></template>
<noscript><div style="position:fixed;top:0;left:0;right:0;bottom:0;overflow:auto;padding:32px;background:#d6d7da;color:#15161a;font:16px/1.5 sans-serif"><h1 style="font-size:28px;margin:0 0 12px">FERRO-88</h1><p>[Your Name]. This site needs JavaScript.</p><p><a href="mailto:hello@example.com">hello@example.com</a></p></div></noscript>
</body>
</html>
